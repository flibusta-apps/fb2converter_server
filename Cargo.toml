[package]
name = "fb2converter_server"
version = "0.1.0"
edition = "2021"


[profile.release]
opt-level = 3
debug = false
strip = true
lto = true
codegen-units = 1
panic = 'abort'

[profile.profiling]
inherits = "release"
debug = true
strip = false


[dependencies]
tokio = { version = "1.44.2", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "net", "signal", "time", "sync"] }
tokio-util = { version = "0.7.14", features = ["compat", "io"] }
futures-util = "0.3.31"

axum = { version = "0.8.1" }
axum-prometheus = "0.9.0"
metrics = "0.24"

tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"]}
sentry-tracing = "0.42.0"
tower-http = { version = "0.6.2", features = ["trace", "request-id"] }

async-tempfile = "0.7.0"
uuid = "1.16.0"
once_cell = "1"

sentry = { version = "0.42.0", features = ["debug-images"] }

tokio-cron-scheduler = "0.14.0"
